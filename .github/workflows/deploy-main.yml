name: Deploy to PROD

on:
  push:
    branches:
      - main

jobs:
  # Yallery only. The engine node used to run this same image and was deployed from here;
  # it now lives in the yengine-api repo and ships from its own workflow, so a push here
  # must not touch it.
  deploy-product:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to PROD server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: root
          key: ${{ secrets.PROD_DEPLOY_KEY }}
          # The node is a 1-vCPU box since the August downsize and the whole sequence no
          # longer fits the action's 10m default: `nest build` alone takes ~4m and
          # `migration:run` another ~2m40s, all of which is ts-node compiling the project
          # rather than touching the database. Past the limit the ssh session is killed
          # mid-run, so the code lands on disk and pm2 keeps serving the previous build —
          # a deploy that reports failure and half-happens.
          command_timeout: 25m
          script: |
            set -euo pipefail
            cd /root/yallery-backend
            git reset --hard HEAD
            git clean -fd
            git pull origin main
            npm install
            npm run build
            npm run migration:run
            pm2 restart yallery-backend
            # `pm2 restart` returns 0 even when the app then crash-loops, which is how a
            # broken DI graph shipped as a green deploy on 2026-08-13 and served 502s
            # until someone looked. Nest on this 1-vCPU box takes ~40-60s to come up, so
            # poll rather than sleep once: any HTTP answer (even 4xx) proves the app is
            # accepting requests, and only a full minute of silence fails the deploy.
            for i in $(seq 1 12); do
              sleep 10
              code=$(curl -s -o /dev/null -w '%{http_code}' -m 5 -X POST http://127.0.0.1:3000/auth/login -H 'Content-Type: application/json' -d '{}' || true)
              if [ "$code" != "000" ] && [ -n "$code" ]; then echo "app is answering (http $code)"; exit 0; fi
            done
            echo "app never came up after restart"; pm2 logs yallery-backend --lines 30 --nostream; exit 1
